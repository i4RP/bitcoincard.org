<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f9fafb" />
    <title>BitcoinCard | ビットコインVISAカード</title>
    <!-- OGP Meta Tags -->
    <meta property="og:title" content="BitcoinCard | ビットコインVISAカード" />
    <meta property="og:description" content="暗号資産でどこでも決済。世界で最も速く、最も安く、最も信頼される金融基盤。" />
    <meta property="og:image" content="https://bitcoincard.org/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://bitcoincard.org" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BitcoinCard" />
    <meta property="og:locale" content="ja_JP" />
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BitcoinCard | ビットコインVISAカード" />
    <meta name="twitter:description" content="暗号資産でどこでも決済。世界で最も速く、最も安く、最も信頼される金融基盤。" />
    <meta name="twitter:image" content="https://bitcoincard.org/images/og-image.png" />
    <!-- General Meta -->
    <meta name="description" content="暗号資産でどこでも決済。世界で最も速く、最も安く、最も信頼される金融基盤。" />
    <!-- Phase 1: Preload critical images -->
    <link rel="preload" href="/images/stas-swap.webp?v=3" as="image" type="image/webp" />
    <link rel="preload" href="/images/bv2.webp" as="image" type="image/webp" />
    <link rel="preload" href="/images/btcpay.webp?v=3" as="image" type="image/webp" />
    <link rel="preload" href="/images/close-btn.webp" as="image" type="image/webp" />
    <!-- Phase 1: DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://btcpay.jp" />
    <link rel="preconnect" href="https://btcpay.jp" crossorigin />
    <!-- Phase 1: Critical CSS inline for instant first paint -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
      body { background: #f3f4f6; min-height: 100vh; min-height: 100dvh; }
      #root { max-width: none; width: 100%; margin: 0; padding: 0; text-align: left; }
      /* Skeleton shell visible before React hydrates */
      #skeleton { padding: 24px 12px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      #skeleton .sk { border-radius: 16px; animation: pulse 1.5s ease-in-out infinite; }
      #skeleton .sk-clock { aspect-ratio: 1; background: linear-gradient(135deg, #6366f1, #9333ea); }
      #skeleton .sk-card { aspect-ratio: 1; background: #e5e7eb; }
      #skeleton .sk-banner { grid-column: span 2; height: 220px; background: #e5e7eb; }
      #skeleton .sk-music { aspect-ratio: 1; background: linear-gradient(135deg, #f43f5e, #f97316); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Phase 3: Skeleton UI shown instantly before JS loads -->
      <div id="skeleton" style="min-height:100vh;background:#f3f4f6;user-select:none;">
        <div style="height:24px;grid-column:span 2;"></div>
        <div class="sk sk-clock"></div>
        <div class="sk sk-card"></div>
        <div class="sk sk-banner"></div>
        <div class="sk sk-card"></div>
        <div class="sk sk-music"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
